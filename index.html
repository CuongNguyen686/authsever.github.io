<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f19">
<title>Quản lý khóa API — Quyền quản trị</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body class="gate-page">
<main class="gate">
  <section class="gate-card">
    <div class="brand-mark">K</div>
    <p class="eyebrow">BẢNG QUẢN TRỊ</p>
    <h1>Quản lý khóa API</h1>
    <p class="muted">Quản lý an toàn khóa, thiết bị và giấy phép của bạn.</p>
    <form id="adminGateForm" novalidate>
      <label for="adminSecret">Mật khẩu quản trị</label>
      <input id="adminSecret" name="adminSecret" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu quản trị" required>
      <button class="btn primary full" type="submit">Mở bảng điều khiển</button>
    </form>
    <div id="gateError" class="alert error hidden" role="alert"></div>
    <p class="fine">Lớp khóa phía client không phải biện pháp bảo mật tuyệt đối. Hãy bảo vệ quyền ghi tại Firebase Rules/backend.</p>
  </section>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
